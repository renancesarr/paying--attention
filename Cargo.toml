[workspace]
members = [
    "crates/paying_attention_config",
    "crates/paying_attention_core",
    "crates/paying_attention_desktop",
    "crates/paying_attention_storage",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "git@github.com:renancesarr/paying--attention.git"

[workspace.metadata.paying-attention]
command = "paying-attention"
